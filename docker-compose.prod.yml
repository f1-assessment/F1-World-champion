version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: f1-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-defaultpassword}
      MONGO_INITDB_DATABASE: f1-world-champion
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - f1-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    image: ${DOCKER_USERNAME:-your-username}/f1-backend:${BACKEND_TAG:-latest}
    container_name: f1-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-defaultpassword}@mongodb:27017/f1-world-champion?authSource=admin
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${BACKEND_PORT:-5000}:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - f1-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${DOCKER_USERNAME:-your-username}/f1-frontend:${FRONTEND_TAG:-latest}
    container_name: f1-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}/api
      NEXT_PUBLIC_APP_NAME: F1 World Champion
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - f1-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_data:
    driver: local

networks:
  f1-network:
    driver: bridge
    name: f1-network 