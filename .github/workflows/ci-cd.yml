name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  NODE_VERSION: '18'
  MONGODB_URI: mongodb://localhost:27017/f1-test

jobs:
  # Centralized Cache and Dependencies
  cache:
    runs-on: ubuntu-latest
    name: Cache Dependencies
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node modules
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
            ./BackEnd/node_modules
            ./FrontEnd/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install root dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install backend dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./BackEnd
        run: npm ci

      - name: Install frontend dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./FrontEnd/app
        run: npm ci

  # Security Scan (CodeQL)
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: cache
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Lint Stage
  lint:
    runs-on: ubuntu-latest
    name: Lint Code
    needs: cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
            ./BackEnd/node_modules
            ./FrontEnd/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Lint Backend
        working-directory: ./BackEnd
        run: |
          # TypeScript compilation check serves as linting
          npx tsc --noEmit

      - name: Lint Frontend
        working-directory: ./FrontEnd/app
        run: npm run lint

  # Test Stage
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    needs: [cache, lint]
    services:
      mongodb:
        image: mongo:7.0
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
            ./BackEnd/node_modules
            ./FrontEnd/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run Backend Tests
        working-directory: ./BackEnd
        run: npm run test:coverage
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          NODE_ENV: test

      - name: Upload Backend Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./BackEnd/coverage/lcov.info
          flags: backend
          name: backend-coverage

      # Note: Frontend tests would go here if available
      # - name: Run Frontend Tests
      #   working-directory: ./FrontEnd/app
      #   run: npm test

  # Build Stage
  build:
    runs-on: ubuntu-latest
    name: Build Applications
    needs: [cache, lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cached dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
            ./BackEnd/node_modules
            ./FrontEnd/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Build Backend
        working-directory: ./BackEnd
        run: npm run build

      - name: Build Frontend
        working-directory: ./FrontEnd/app
        run: npm run build

      - name: Upload Backend Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-build
          path: ./BackEnd/dist/

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: ./FrontEnd/app/.next/

  # Docker Build and Push (Optional - Nice to have)
  docker:
    runs-on: ubuntu-latest
    name: Build and Push Docker Images
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./BackEnd
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/f1-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/f1-backend:${{ github.sha }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./FrontEnd/app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/f1-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/f1-frontend:${{ github.sha }}

  # Deploy Stage (Optional - Nice to have)
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: [build, security-scan]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Backend Build
        uses: actions/download-artifact@v3
        with:
          name: backend-build
          path: ./BackEnd/dist/

      - name: Download Frontend Build
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: ./FrontEnd/app/.next/

      # Example deployment to Railway (uncomment and configure as needed)
      # - name: Deploy to Railway
      #   uses: railway-deploy@v1
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     railway_project_id: ${{ secrets.RAILWAY_PROJECT_ID }}

      # Example deployment to Render (uncomment and configure as needed)
      # - name: Deploy to Render
      #   run: |
      #     curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Deployment Success
        run: echo "Deployment completed successfully!" 