name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, BE-dev ]
  pull_request:
    branches: [ main, develop, BE-dev ]

env:
  NODE_VERSION: '18'
  MONGODB_URI: mongodb://localhost:27017/f1-test

jobs:
  # Install Dependencies
  install:
    runs-on: ubuntu-latest
    name: Install Dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./BackEnd
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./FrontEnd/app
        run: npm ci

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
            ./BackEnd/node_modules
            ./FrontEnd/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

  # Security Scan (npm audit)
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
            ./BackEnd/node_modules
            ./FrontEnd/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          cd BackEnd && npm ci
          cd ../FrontEnd/app && npm ci

      - name: Run Backend Security Audit
        working-directory: ./BackEnd
        run: |
          echo "🔍 Running npm audit for backend..."
          npm audit --audit-level=moderate || true
          echo "✅ Backend security audit completed"

      - name: Run Frontend Security Audit  
        working-directory: ./FrontEnd/app
        run: |
          echo "🔍 Running npm audit for frontend..."
          npm audit --audit-level=moderate || true
          echo "✅ Frontend security audit completed"

      - name: Check for High/Critical Vulnerabilities
        run: |
          echo "🔍 Checking for high/critical vulnerabilities..."
          cd BackEnd
          BACKEND_AUDIT=$(npm audit --audit-level=high --json | jq -r '.metadata.vulnerabilities | .high + .critical' 2>/dev/null || echo "0")
          cd ../FrontEnd/app  
          FRONTEND_AUDIT=$(npm audit --audit-level=high --json | jq -r '.metadata.vulnerabilities | .high + .critical' 2>/dev/null || echo "0")
          
          echo "Backend high/critical vulnerabilities: $BACKEND_AUDIT"
          echo "Frontend high/critical vulnerabilities: $FRONTEND_AUDIT"
          
          if [ "$BACKEND_AUDIT" != "0" ] || [ "$FRONTEND_AUDIT" != "0" ]; then
            echo "⚠️ High or critical vulnerabilities found! Please review and fix."
            exit 1
          else
            echo "✅ No high or critical vulnerabilities found"
          fi

  # Lint Stage
  lint:
    runs-on: ubuntu-latest
    name: Lint Code
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
            ./BackEnd/node_modules
            ./FrontEnd/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          cd BackEnd && npm ci
          cd ../FrontEnd/app && npm ci

      - name: Lint Backend
        working-directory: ./BackEnd
        run: |
          # TypeScript compilation check serves as linting
          npx tsc --noEmit

      - name: Lint Frontend
        working-directory: ./FrontEnd/app
        run: npm run lint

  # Test Stage
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    needs: [install, lint]
    services:
      mongodb:
        image: mongo:7.0
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
            ./BackEnd/node_modules
            ./FrontEnd/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          cd BackEnd && npm ci
          cd ../FrontEnd/app && npm ci

      - name: Run Backend Tests
        working-directory: ./BackEnd
        run: npm run test:coverage
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          NODE_ENV: test

      - name: Upload Backend Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./BackEnd/coverage/lcov.info
          flags: backend
          name: backend-coverage

      - name: Run Frontend Tests
        working-directory: ./FrontEnd/app
        run: |
          # Check if test script exists and run tests
          if npm run test --dry-run 2>/dev/null; then
            npm run test:ci || npm test -- --passWithNoTests --coverage --watchAll=false
          else
            echo "No frontend test script found, creating basic test setup..."
            # For Next.js apps without tests, we can at least verify the build works
            npm run build
            echo "Frontend build test passed ✅"
          fi

      - name: Upload Frontend Coverage
        uses: codecov/codecov-action@v3
        if: hashFiles('FrontEnd/app/coverage/lcov.info') != ''
        with:
          file: ./FrontEnd/app/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # Build Stage
  build:
    runs-on: ubuntu-latest
    name: Build Applications
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ./node_modules
            ./BackEnd/node_modules
            ./FrontEnd/app/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: |
          npm ci
          cd BackEnd && npm ci
          cd ../FrontEnd/app && npm ci

      - name: Build Backend
        working-directory: ./BackEnd
        run: npm run build

      - name: Build Frontend
        working-directory: ./FrontEnd/app
        run: npm run build

      - name: Upload Backend Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-build
          path: ./BackEnd/dist/

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: ./FrontEnd/app/.next/

  # Docker Build and Push (Optional - Nice to have)
  docker:
    runs-on: ubuntu-latest
    name: Build and Push Docker Images
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./BackEnd
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/f1-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/f1-backend:${{ github.sha }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./FrontEnd/app
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/f1-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/f1-frontend:${{ github.sha }}

  # Deploy Stage (Optional - Nice to have)
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: [build, security-scan]  # Restored security-scan dependency
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Backend Build
        uses: actions/download-artifact@v3
        with:
          name: backend-build
          path: ./BackEnd/dist/

      - name: Download Frontend Build
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: ./FrontEnd/app/.next/

      # Placeholder for actual deployment steps
      - name: Deploy Applications
        run: |
          echo "🚀 Deploying applications..."
          echo "Backend build ready in ./BackEnd/dist/"
          echo "Frontend build ready in ./FrontEnd/app/.next/"
          echo "✅ Deployment completed successfully!" 